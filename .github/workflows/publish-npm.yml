name: Publish npm package

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish @piphi-network/cli
    if: github.repository == 'PiPhi-io/piphi_network_create'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the release tag
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install trusted-publishing npm client
        run: npm install --global npm@12.2.0

      - name: Verify tag and package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module -e '
            import packageJson from "./package.json" with { type: "json" };
            const expected = `v${packageJson.version}`;
            if (process.env.RELEASE_TAG !== expected) {
              console.error(`Release tag ${process.env.RELEASE_TAG} does not match package version ${expected}.`);
              process.exit(1);
            }
          '

      - name: Install locked dependencies
        run: npm ci

      - name: Type-check
        run: npm run check

      - name: Test
        run: npm test

      - name: Verify package contents
        run: npm pack --dry-run

      - name: Publish with provenance
        run: npm publish --access public --provenance
